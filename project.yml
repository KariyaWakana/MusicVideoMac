name: MusicVideoMacApp
options:
  bundleIdPrefix: com.musicvideo
  developmentLanguage: en
  localizations:
    - en
    - zh-Hans
    - ja
    - fr
targets:
  MusicVideoMacApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleName: "MusicVideo"
        CFBundleDisplayName: "Music Video Generator"
        CFBundleIconName: "MusicVideo"
        LSApplicationCategoryType: "public.app-category.video"
        NSPrincipalClass: NSApplication
        NSRemovableVolumesUsageDescription: "需要读取外置光驱中的音乐"
        NSDesktopFolderUsageDescription: "需要保存视频到桌面"
        LSMinimumSystemVersion: "14.0"
    entitlements:
      path: MusicVideoMacApp.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: MusicVideo
        ENABLE_PREVIEWS: YES
        SWIFT_VERSION: 5.0
        SWIFT_EMIT_LOC_STRINGS: YES
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        INFOPLIST_KEY_CFBundleDisplayName: "Music Video Generator"
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
